[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantictwin-starter"
version = "0.2.0"
description = "Hackathon-ready, modular RGB-only multiview + semantic digital-twin starter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=9.5"]

[project.optional-dependencies]
ply = ["plyfile>=1.0"]
cv = ["opencv-python-headless>=4.8"]
test = ["pytest>=7"]

[project.scripts]
semantictwin = "semantictwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
